name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install the package and its development dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . --group dev
    - name: Test with pytest
      run: |
        pytest --cov=pyqn

  docs:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Install the package and the documentation tools
      run: |
        python -m pip install --upgrade pip
        pip install . --group docs
    - name: Build the documentation, failing on any warning
      run: |
        sphinx-build -W --keep-going -b html docs docs/_build/html

  lint:
    name: Check format and lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Install the development dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --group dev
    - name: Check code format
      run: |
        ruff format --check .
    - name: Lint
      run: |
        ruff check --output-format=github .
