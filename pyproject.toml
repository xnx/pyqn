[build-system]
requires = ["setuptools>=43", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# The oldest Python that ruff supports (python_requires is >=3.6).
target-version = "py37"

[tool.ruff.lint]
# Ruff's classic default rules (pyflakes and pycodestyle errors), listed
# explicitly because newer ruff releases enable many more by default.
select = ["E4", "E7", "E9", "F"]
