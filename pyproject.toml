[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyqn"
dynamic = ["version"]
description = "A package for managing physical units and quantities"
readme = "README.rst"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Christian Hill" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["chemistry", "units", "physical quantities", "unit conversion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/xnx/pyqn"
Issues = "https://github.com/xnx/pyqn/issues"
Changelog = "https://github.com/xnx/pyqn/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff==0.17.2"]

[tool.setuptools.dynamic]
version = { attr = "pyqn.__version__" }

[tool.pytest.ini_options]
# The examples in the README are tested too.
testpaths = ["tests", "README.rst"]
addopts = ["--doctest-glob=README.rst"]
# Compare only the type of exceptions, not their module or message.
doctest_optionflags = ["IGNORE_EXCEPTION_DETAIL"]

[tool.ruff.lint]
# Pyflakes, pycodestyle errors, import order and pyupgrade. The rules are
# listed explicitly because newer ruff releases enable many more by default.
select = ["E4", "E7", "E9", "F", "I", "UP"]
